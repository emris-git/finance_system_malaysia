[project]
name = "finance"
version = "0.2.0"
description = "Personal finance system: statement parsers, Postgres ledger, Telegram bot, web dashboard"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.54,<0.55",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.31,<0.32",
    "alembic>=1.20,<2",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "pypdf>=6.19,<7",
    # pypdf needs it to decrypt AES-encrypted statements (TNG, Maybank).
    "cryptography>=44",
    "aiogram>=3.31,<4",
    "itsdangerous>=2.2,<3",
    "jinja2>=3.1,<4",
    "apscheduler>=3.11,<4",
    "python-multipart>=0.0.32",
    "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.4,<2",
]

[project.scripts]
finance = "finance.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["finance*"]

[tool.setuptools.package-data]
finance = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
